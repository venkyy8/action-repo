name: Notify Teams on Job Status

on:
  push:
    branches:
      - main  # Trigger on push to the main branch
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run some job (e.g., test)
        run: |
          echo "Running tests..."
          # Example command, replace with actual commands
          # exit 1  # Uncomment to simulate failure

      - name: Send notification to Teams
        if: always()  # This ensures the notification is sent even if the job fails
        run: |
          # Define the payload for Teams
          payload=$(cat <<EOF
          {
            "text": "GitHub Action Status for ${GITHUB_REPOSITORY}: \n
                     Workflow: ${GITHUB_WORKFLOW}\n
                     Event: ${GITHUB_EVENT_NAME}\n
                     Commit: ${GITHUB_SHA}\n
                     Status: ${{ job.status }}\n
                     URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          )

          # Send the notification to Teams using the Webhook URL stored in secrets
          curl -H "Content-Type: application/json" \
               -d "$payload" \
               ${{ secrets.TEAMS_WEBHOOK_URL }}
